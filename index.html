<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMessage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            padding: 20px;
            flex-direction: row;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                padding: 10px;
            }
        }

        .iphone-container {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 55px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 12px solid #000;
        }

        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 19px;
            z-index: 1000;
        }

        .status-bar {
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 30px;
            padding-top: 16px;
            font-size: 15px;
            font-weight: 600;
            position: relative;
            z-index: 999;
        }

        .status-bar.light {
            color: #000;
            background: #f6f6f6;
        }

        .status-bar.dark {
            color: #fff;
            background: #1C1C1E;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .battery-percent {
            font-size: 15px;
            font-weight: 600;
        }

        .battery-percent.light {
            color: #000;
        }

        .battery-percent.dark {
            color: #fff;
        }

        .battery-icon {
            width: 27px;
            height: 13px;
            border-radius: 3px;
            position: relative;
            padding: 2px;
        }

        .battery-icon.light {
            border: 2px solid #000;
        }

        .battery-icon.dark {
            border: 2px solid #fff;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 6px;
            border-radius: 0 1px 1px 0;
        }

        .battery-icon.light::after {
            background: #000;
        }

        .battery-icon.dark::after {
            background: #fff;
        }

        .battery-fill {
            width: 85%;
            height: 100%;
        }

        .battery-fill.light {
            background: #000;
        }

        .battery-fill.dark {
            background: #fff;
        }

        .imessage-screen {
            height: calc(100% - 54px);
            display: flex;
            flex-direction: column;
        }

        .imessage-screen.light {
            background: #f6f6f6;
        }

        .imessage-screen.dark {
            background: #1C1C1E;
        }

        .message-header {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid;
            position: relative;
        }

        .message-header.light {
            background: #f6f6f6;
            border-bottom-color: #c6c6c8 !important;
        }

        .message-header.dark {
            background: #1C1C1E;
            border-bottom-color: #545458 !important;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            left: 20px;
        }

        .back-button {
            color: #007AFF;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .contact-name {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        .contact-name.light {
            color: #000000 !important;
        }

        .contact-name.dark {
            color: #ffffff !important;
        }

        .header-right {
            display: flex;
            gap: 15px;
            position: absolute;
            right: 20px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 40px;
        }

        .message-group {
            margin-bottom: 15px;
        }

        .message-bubble {
            max-width: 260px;
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 4px;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.4;
        }

        .message-sent {
            background: #0a84ff !important;
            color: #fff !important;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .message-received {
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .message-received.light {
            background: #e5e5ea !important;
            color: #000000 !important;
        }

        .message-received.dark {
            background: #2c2c2e !important;
            color: #ffffff !important;
        }

        .message-time {
            font-size: 12px;
            margin-top: 4px;
            text-align: right;
        }

        .message-time.light {
            color: #8e8e93;
        }

        .message-time.dark {
            color: #8e8e93;
        }

        .message-time.sent {
            text-align: right;
        }

        .message-time.received {
            text-align: left;
        }

        .controls {
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            color: #fff;
            width: 350px;
            max-width: 100%;
            flex-shrink: 0;
        }

        @media (min-width: 1025px) {
            .controls {
                position: static;
            }
        }

        @media (max-width: 1024px) {
            .controls {
                position: static;
                width: 100%;
                max-width: 390px;
            }
        }

        .controls h3 {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .controls label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .controls input, .controls textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            background: #2c2c2e;
            color: #fff;
            font-family: inherit;
        }

        .controls textarea {
            min-height: 100px;
            resize: vertical;
        }

        .controls button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: #007AFF;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .controls button:hover {
            background: #0051D5;
        }

        .theme-toggle {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .theme-toggle button {
            flex: 1;
            margin: 0;
        }

        .theme-toggle button.active {
            background: #34C759;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>메시지 입력</h3>
        
        <label>
            내가 누구인지 선택
            <div class="theme-toggle" style="margin-top: 8px;">
                <button onclick="setMe('first')" id="meFirst">수신인</button>
                <button onclick="setMe('second')" id="meSecond" class="active">발신인</button>
            </div>
            <small style="color: #8e8e93; display: block; margin-top: 5px;">예: 수신인/발신인 중 누가 '나'인지 선택</small>
        </label>
        
        <label style="margin-top: 15px;">
            메시지 내용<br>
            <small style="color: #8e8e93;">형식: &lt;수신인 / 시간 / 발신인&gt;<br>[보낸 내용]<br>줄바꿈으로 여러 메시지 입력</small>
            <textarea id="messageInput" placeholder="예시:
< 수신인 / 00:00 / 발신인 >
[메시지 1]
[메시지 2]

< 발신인 / 00:00 / 수신인 >
[메시지 3]
[메세지 4]"></textarea>
        </label>
        
        <label>
            테마 선택
            <div class="theme-toggle">
                <button onclick="setTheme('light')">라이트</button>
                <button onclick="setTheme('dark')" class="active">다크</button>
            </div>
        </label>
        
        <button onclick="renderMessages()">메시지 생성</button>
        <button onclick="saveAsImage()" style="background: #34C759; margin-top: 5px;">이미지로 저장</button>
    </div>

    <div class="iphone-container">
        <div class="dynamic-island"></div>
        
        <div class="status-bar dark" id="statusBar">
            <div class="status-left">
                <span id="timeDisplay">00:00</span>
            </div>
            <div class="status-right">
                <span class="battery-percent dark" id="batteryPercent">83<b>%</b></span>
                <div class="battery-icon dark" id="batteryIcon">
                    <div class="battery-fill dark" id="batteryFill"></div>
                </div>
            </div>
        </div>

        <div class="imessage-screen dark" id="imessageScreen">
            <div class="message-header dark" id="messageHeader">
                <div class="header-left">
                    <span class="back-button"><b>‹ 메시지</b></span>
                </div>
                <div class="contact-name dark" id="contactName">대화 상대</div>
                <div class="header-right">
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
            </div>
        </div>
    </div>

    <script>
        let currentTheme = 'dark';
        let mePosition = 'second';

        function setMe(position) {
            mePosition = position;
            document.getElementById('meFirst').classList.remove('active');
            document.getElementById('meSecond').classList.remove('active');
            document.getElementById('me' + (position === 'first' ? 'First' : 'Second')).classList.add('active');
            
            if (document.getElementById('messagesContainer').children.length > 0) {
                renderMessages();
            }
        }

        function setTheme(theme) {
            currentTheme = theme;
            const elements = ['statusBar', 'imessageScreen', 'messageHeader', 'batteryPercent', 'batteryIcon', 'batteryFill'];
            
            elements.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('light', 'dark');
                el.classList.add(theme);
            });

            document.getElementById('contactName').classList.remove('light', 'dark');
            document.getElementById('contactName').classList.add(theme);

            document.querySelectorAll('.theme-toggle button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (document.getElementById('messagesContainer').children.length > 0) {
                renderMessages();
            }
        }

        function renderMessages() {
            const input = document.getElementById('messageInput').value.trim();
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (!input) return;

            const lines = input.split('\n').filter(line => line.trim());
            let currentHeader = null;
            let firstPerson = null;
            let secondPerson = null;
            let lastTime = '';
            let messageGroups = [];
            let currentGroup = null;

            // 헤더별로 메시지 그룹화
            lines.forEach(line => {
                line = line.trim();
                
                if (line.startsWith('<') && line.includes('>')) {
                    const headerMatch = line.match(/<(.+?)>/);
                    if (headerMatch) {
                        const headerContent = headerMatch[1];
                        const parts = headerContent.split('/').map(s => s.trim());
                        
                        if (parts.length >= 3) {
                            const [sender, time, receiver] = parts;
                            
                            if (!firstPerson) {
                                firstPerson = sender;
                                secondPerson = receiver;
                            }
                            
                            lastTime = time;
                            
                            // 새로운 그룹 시작
                            currentGroup = {
                                sender,
                                time,
                                receiver,
                                messages: []
                            };
                            messageGroups.push(currentGroup);
                        }
                    }
                }
                else if (line.startsWith('[') && line.endsWith(']') && currentGroup) {
                    const content = line.substring(1, line.length - 1);
                    currentGroup.messages.push(content);
                }
            });

            // 각 그룹을 렌더링
            messageGroups.forEach(group => {
                group.messages.forEach((content, index) => {
                    const isLastInGroup = index === group.messages.length - 1;
                    addMessageToContainer(container, {
                        sender: group.sender,
                        time: group.time,
                        receiver: group.receiver,
                        content: content
                    }, firstPerson, secondPerson, isLastInGroup);
                });
            });

            if (firstPerson && secondPerson) {
                const myName = mePosition === 'first' ? firstPerson : secondPerson;
                const otherName = mePosition === 'first' ? secondPerson : firstPerson;
                document.getElementById('contactName').textContent = otherName;
            }

            if (lastTime) {
                const timeWithoutAMPM = lastTime.replace(/\s*(AM|PM|am|pm)\s*/g, '').trim();
                document.getElementById('timeDisplay').textContent = timeWithoutAMPM;
            }

            container.scrollTop = container.scrollHeight;
        }

        function addMessageToContainer(container, message, firstPerson, secondPerson, showTime) {
            const myName = mePosition === 'first' ? firstPerson : secondPerson;
            const isSent = message.sender === myName;
            
            const messageGroup = document.createElement('div');
            messageGroup.className = 'message-group';
            messageGroup.style.display = 'flex';
            messageGroup.style.flexDirection = 'column';
            messageGroup.style.alignItems = isSent ? 'flex-end' : 'flex-start';
            messageGroup.style.marginBottom = showTime ? '15px' : '0px';

            const bubble = document.createElement('div');
            bubble.className = isSent ? 'message-bubble message-sent' : `message-bubble message-received ${currentTheme}`;
            bubble.textContent = message.content;
            bubble.style.whiteSpace = 'pre-wrap';
            bubble.style.marginBottom = '4px';

            messageGroup.appendChild(bubble);

            // 그룹의 마지막 메시지에만 시간 표시
            if (showTime) {
                const timeEl = document.createElement('div');
                timeEl.className = `message-time ${currentTheme} ${isSent ? 'sent' : 'received'}`;
                timeEl.textContent = message.time;
                timeEl.style.marginBottom = '0px';
                messageGroup.appendChild(timeEl);
            }

            container.appendChild(messageGroup);
        }

        async function saveAsImage() {
            if (typeof html2canvas === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                script.onload = () => captureAndDownload();
                document.head.appendChild(script);
            } else {
                captureAndDownload();
            }
        }

        async function captureAndDownload() {
            const phoneContainer = document.querySelector('.iphone-container');
            
            const originalBg = document.body.style.background;
            document.body.style.background = 'transparent';
            
            const canvas = await html2canvas(phoneContainer, {
                backgroundColor: null,
                scale: 2,
                logging: false,
                useCORS: true,
                allowTaint: true
            });
            
            document.body.style.background = originalBg;
            
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'imessage-' + Date.now() + '.png';
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        renderMessages();
    </script>
</body>
</html>
